<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#101A44">
<title>Save contact</title>
<link rel="stylesheet" href="save-contact.css">
</head>
<body>
<main class="page">
  <section id="card" class="card" aria-labelledby="name" hidden>
    <img id="logo" class="logo" alt="">
    <h1 id="name" class="name" dir="auto"></h1>
    <p id="role" class="role" dir="auto"></p>
    <ul id="details" class="details"></ul>
  </section>
  <div id="actions" class="actions" hidden>
    <button id="save" type="button" class="save">Save contact</button>
    <p id="hint" class="hint" hidden>When the download finishes, tap <strong>Open</strong> to add the contact.</p>
    <p class="note">Nothing happened? Open this page in Safari or Chrome (&#x22EF; &rarr; Open in browser), then tap Save contact again.</p>
    <p class="note">Details shared by the sender.</p>
  </div>
  <section id="invalid" class="invalid" role="alert" hidden>
    <h1>This contact link is incomplete</h1>
    <p>Ask the sender to share it again.</p>
  </section>
</main>
<script src="save-contact.js"></script>
<script src="app.js"></script>
</body>
</html>
